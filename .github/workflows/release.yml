name: Build and Release

on:
  push:
    tags:
      - 'v*'  # запуск при пуше тега, начинающегося с v

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'  # укажите версию из вашего go.mod

      - name: Setup Node (для сборки фронтенда)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd internal/web
          npm ci
          npm run build
          cd ../..

      - name: Build Go binary
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -ldflags "-w -s" -o x-ui main.go

      - name: Prepare release package
        run: |
          mkdir -p x-ui/bin
          cp x-ui ./x-ui/x-ui
          cp x-ui.sh ./x-ui/x-ui.sh
          cp x-ui.service ./x-ui/x-ui.service 2>/dev/null || true
          cp x-ui.service.debian ./x-ui/ 2>/dev/null || true
          # Если у вас есть xray в репозитории — скопируйте его в bin
          # cp bin/xray-linux-amd64 ./x-ui/bin/ 2>/dev/null || true
          tar -czvf x-ui-linux-amd64.tar.gz -C x-ui .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: x-ui-linux-amd64.tar.gz
