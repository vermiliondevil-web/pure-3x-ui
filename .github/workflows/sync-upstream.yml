name: Sync Upstream

on:
  schedule:
    # Каждый день в 03:00 UTC (06:00 МСК)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/MHSanaei/3x-ui.git || true
          git fetch upstream main

          # Проверяем, есть ли новые коммиты
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            exit 0
          fi

          # ШАГ 1: Берём локали и update.sh из upstream напрямую
          # (это избегает конфликтов при merge)
          git checkout upstream/main -- internal/web/translation/ || true
          git checkout upstream/main -- update.sh || true
          
          # ШАГ 1.5: Коммитим эти изменения, чтобы merge не ругался
          git add -A
          git diff --cached --quiet || git commit -m "chore: take locales and update.sh from upstream (pre-merge)"

          # ШАГ 2: Мержим остальные файлы с -X theirs
          # (при конфликте берётся версия upstream)
          git merge upstream/main -X theirs --no-edit || {
            echo "=== MERGE CONFLICT (unexpected) ==="
            git status
            git diff --name-only --diff-filter=U
            git merge --abort
            exit 1
          }

      - name: Strip ads after upstream merge
        run: |
          bash scripts/remove-ads.sh
          git add -A
          git diff --cached --quiet || git commit -m "chore: auto strip ads after upstream merge"

      - name: Push changes
        run: git push origin main
